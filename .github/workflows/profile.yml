name: Gerar imagens do perfil

on:
  # atualiza automaticamente a cada 6 horas
  schedule:
    - cron: "0 */6 * * *"
  # permite rodar manualmente pela aba Actions
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow é usado só para desenhar o avatar em LEDs
      - run: pip install pillow

      - name: Gerar cards do perfil
        run: python scripts/profile_cards.py --user "${{ github.repository_owner }}" --out dist
        env:
          # PROFILE_TOKEN (opcional, token pessoal) inclui contribuições privadas;
          # sem ele, só dados públicos
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Gerar a cobra
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # publica tudo na branch "output", usada pelo README
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
